name: Aiven MySQL 24/7 Keep-Alive

on:
  schedule:
    # Runs at the top of every hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Ping Live Web Dashboard on Vercel
        run: |
          echo "Pinging Vercel Live API..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://inventorymanagement-lake.vercel.app/api/stats || true

      - name: Run Aiven Database Heartbeat
        run: |
          python aiven_keeper.py
